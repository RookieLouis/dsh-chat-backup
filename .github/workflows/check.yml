name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Build and isolated unit tests use only Node's built-in modules.
      # DSH peers are supplied by Desktop for native integration checks.
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- lib/client.js
